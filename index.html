<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b3a1e">
<title>Quán cà phê - trạm gió</title>
<style>
html,body{margin:0;background:#f7f1e8;color:#5b3a1e;font:16px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.m{max-width:360px;margin:28vh auto 0;padding:0 16px;text-align:center}
.v{width:34px;height:34px;border:4px solid #e2d6c4;border-top-color:#5b3a1e;border-radius:50%;margin:0 auto 14px;animation:q 1s linear infinite}
@keyframes q{to{transform:rotate(360deg)}}
.mo{color:#7a6a5a;font-size:13px;margin-top:8px}
button{border:0;border-radius:10px;padding:12px 18px;background:#5b3a1e;color:#fff;font:inherit;font-weight:600;margin-top:14px;width:100%}
a{color:#5b3a1e}
</style>
</head>
<body>
<div class="m" id="m"><div class="v"></div>Đang mở app…<div class="mo" id="mo"></div></div>
<script>
/*
 * TRANG MỒI (từ bản 2.25) — tải lên GitHub MỘT LẦN, không phải sửa nữa.
 * Giao diện thật nằm trên Apps Script: trang này lấy về (?giaodien=1), nhớ trên điện thoại rồi hiện.
 * Mỗi lần mở: hiện ngay bản đã nhớ; vài giây sau hỏi máy chủ số phiên bản (?giaodien=pb),
 * có bản mới thì tải về sẵn cho lần mở sau. Bấm "có bản mới, tải lại" trong app thì lấy bản mới ngay.
 * Chỉ phải sửa file này nếu đổi link /exec (tạo bản triển khai MỚI thay vì sửa bản cũ).
 */
var QC_MAY = 'https://script.google.com/macros/s/AKfycbzulp5rTDJiVMMZwqQx4xgIFKvc9dDtasISugKqlUVHl1z_-dmilhVBzpUzq16_YCWGdA/exec';

/** Toàn bộ logic nằm trong một hàm để chép được vào trang app (kiểm bản mới chạy ở phía sau khi app đã mở). */
function QC_MOI(MAY, cheDo) {
  var KHOA = 'qc_giaodien', TEN_CACHE = 'qc-giaodien', DUONG = location.pathname.replace(/[^\/]*$/, '') + '__giaodien__';
  function hetGio(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Hết thời gian chờ')); }, ms); })]); }
  function docNho() {
    var ls = function () { try { var o = JSON.parse(localStorage.getItem(KHOA) || 'null'); return o && o.html ? o : null; } catch (e) { return null; } };
    if (!window.caches) return Promise.resolve(ls());
    return caches.open(TEN_CACHE).then(function (c) { return c.match(DUONG); }).then(function (r) { return r ? r.json() : ls(); }).catch(ls);
  }
  function luuNho(o) {
    var s = JSON.stringify(o);
    var ls = function () { try { localStorage.setItem(KHOA, s); } catch (e) {} };
    if (!window.caches) { ls(); return Promise.resolve(); }
    return caches.open(TEN_CACHE).then(function (c) { return c.put(DUONG, new Response(s, { headers: { 'Content-Type': 'application/json' } })); })
      .then(function () { try { localStorage.removeItem(KHOA); } catch (e) {} }, ls);
  }
  function hoiPB() { return hetGio(fetch(MAY + '?giaodien=pb&t=' + Date.now(), { cache: 'no-store' }), 20000).then(function (r) { return r.json(); }).then(function (j) { return String(j.pb || ''); }); }
  function layGD() {
    return hetGio(fetch(MAY + '?giaodien=1&t=' + Date.now(), { cache: 'no-store' }), 30000).then(function (r) { if (!r.ok) throw new Error('Máy chủ trả lỗi ' + r.status); return r.text(); }).then(function (html) {
      var m = html.match(/var PHIEN_BAN_APP = '([^']+)'/);
      if (!m || html.indexOf('<?') >= 0 || !/<\/html>\s*$/i.test(html)) throw new Error('Giao diện tải về không đúng');
      return { pb: m[1], html: html, luc: Date.now() };
    });
  }
  /* Chạy ở phía sau trong trang app: có bản mới thì tải về sẵn (không tự tải lại để khỏi mất việc đang nhập). */
  if (cheDo === 'nen') {
    setTimeout(function () {
      docNho().then(function (nho) {
        return hoiPB().then(function (pb) { if (pb && (!nho || nho.pb !== pb)) return layGD().then(luuNho); });
      }).catch(function () {});
    }, 5000);
    return;
  }
  function hien(o) {
    var chen = '<script>(' + QC_MOI.toString() + ')(' + JSON.stringify(MAY) + ',"nen");<\/script>';
    var i = o.html.lastIndexOf('</body>');
    var html = i >= 0 ? o.html.slice(0, i) + chen + o.html.slice(i) : o.html + chen;
    document.open(); document.write(html); document.close();
  }
  function baoLoi(e, nho) {
    var el = document.getElementById('m'); if (!el) return;
    el.innerHTML = '<b>Không mở được app</b><div class="mo">' + String(e && e.message || e).replace(/</g, '&lt;') + (navigator.onLine === false ? ' · điện thoại đang mất mạng' : '') +
      '</div><button onclick="location.reload()">Thử lại</button>' + (nho ? '<button style="background:#efe4d3;color:#5b3a1e" onclick="QC_MOI(QC_MAY,\'nho\')">Mở bản đã nhớ (' + nho.pb + ')</button>' : '') +
      '<div class="mo">Hoặc dùng link dự phòng: <a href="' + MAY + '">mở app trên Google</a></div>';
  }
  var layMoi = cheDo === 'moi';
  try { if (sessionStorage.getItem('qc_lay_moi') === '1') { layMoi = true; sessionStorage.removeItem('qc_lay_moi'); } } catch (e) {}
  docNho().then(function (nho) {
    if (nho && (cheDo === 'nho' || !layMoi)) return hien(nho);
    var mo = document.getElementById('mo'); if (mo) mo.textContent = nho ? 'Đang lấy bản mới…' : 'Lần đầu mở trên máy này, chờ vài giây…';
    return layGD().then(function (o) { return luuNho(o).then(function () { hien(o); }, function () { hien(o); }); }, function (e) {
      if (nho && layMoi) return hien(nho); // lấy bản mới lỗi → dùng tạm bản đã nhớ
      baoLoi(e, nho);
    });
  });
}
QC_MOI(QC_MAY);
</script>
</body>
</html>
