<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b3a1e">
<title>Quán cà phê - trạm gió</title>
<style>
:root{--nau:#5b3a1e;--nau2:#8a5a2b;--kem:#f7f1e8;--kem2:#efe4d3;--xanh:#2e7d32;--do:#c62828;--vang:#ef8f00;--chu:#2b2118;--mo:#7a6a5a;--vien:#e2d6c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--kem);color:var(--chu);font:16px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--nau);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0;font-weight:600}
header small{opacity:.85;font-size:12px}header .pb{font-size:11px;opacity:.9;white-space:nowrap}.so-moi{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;background:var(--nau);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--vien);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 6px;color:var(--mo);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span.ic{font-size:20px;line-height:1}
nav button.on{color:var(--nau);font-weight:600}
.the{background:#fff;border:1px solid var(--vien);border-radius:12px;padding:14px;margin-bottom:12px}
.the h2{font-size:15px;margin:0 0 10px;color:var(--nau)}
.hang{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hang>*{flex:1;min-width:0}
.nut{display:inline-block;border:0;border-radius:10px;padding:12px 14px;background:var(--nau);color:#fff;font-weight:600;width:100%;text-align:center;cursor:pointer}
.nut.phu{background:var(--kem2);color:var(--nau)}
.nut.xanh{background:var(--xanh)}.nut.do{background:var(--do)}.nut.vang{background:var(--vang)}
.nut.nho{padding:7px 10px;font-size:13px;width:auto}
.nut:disabled{opacity:.5}
.nut.lon{padding:22px;font-size:20px;border-radius:16px}
label{display:block;font-size:13px;color:var(--mo);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--vien);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
textarea{min-height:64px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--kem2);color:var(--nau)}
.tag.xanh{background:#e3f2e5;color:var(--xanh)}.tag.do{background:#fbe5e5;color:var(--do)}.tag.vang{background:#fff1dc;color:#a35a00}
.dong{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--vien);align-items:flex-start}
.dong:last-child{border-bottom:0}
.dong .trai{flex:1;min-width:0}.dong .phai{text-align:right;white-space:nowrap}
.mo{color:var(--mo);font-size:13px}
.so{font-size:26px;font-weight:700;color:var(--nau)}
.luoi{display:grid;gap:8px}
.luoi.c2{grid-template-columns:1fr 1fr}.luoi.c3{grid-template-columns:1fr 1fr 1fr}
.bh{margin:9px 0}.bh-dau{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:baseline}.bh-ten{min-width:0;flex:1}
.bh-ray{height:8px;background:var(--kem2);border-radius:4px;margin-top:4px;overflow:hidden}.bh-ray div{height:100%;border-radius:4px}.bh-phu{font-size:12px;margin-top:3px}
.chong{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:4px 0 10px;background:var(--kem2)}.chong div{height:100%}
.chu-giai{display:grid;grid-template-columns:12px 1fr auto auto;gap:6px 8px;font-size:14px;align-items:center}.cham{width:10px;height:10px;border-radius:3px}
.kpi{background:var(--kem);border-radius:10px;padding:10px;text-align:center}.kpi .so{font-size:21px}.kpi .mo{font-size:12px}.len{color:var(--xanh);font-weight:600}.xuong{color:var(--do);font-weight:600}
.cot-wrap{position:relative;display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:4px}.cot{flex:1;border-radius:2px 2px 0 0;cursor:pointer;min-width:2px}
.tb-line{position:absolute;left:0;right:0;border-top:1px dashed var(--do);pointer-events:none}.tb-line span{position:absolute;right:0;top:-16px;font-size:11px;color:var(--do);background:#fff;padding:0 3px}
.tab{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tab button{border:1px solid var(--vien);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;color:var(--mo)}
.tab button.on{background:var(--nau);color:#fff;border-color:var(--nau)}
.anh-o{border:2px dashed var(--vien);border-radius:10px;padding:10px;text-align:center;color:var(--mo);font-size:13px;position:relative;min-height:60px}
.anh-o img{max-width:100%;max-height:180px;border-radius:8px;display:block;margin:0 auto}
.anh-o input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.tt-anh{font-size:12px;color:var(--mo);margin-top:4px;flex:1 0 100%;text-align:center}.anh-o:not(.anh-2) .tt-anh{position:relative;z-index:1;pointer-events:none}
.anh-2{display:flex;flex-wrap:wrap;gap:6px;padding:6px}.anh-2>img{flex:1 0 100%}.anh-2 label.chon{flex:1;position:relative;padding:10px 4px;border-radius:8px;background:var(--kem);color:var(--nau);font-size:13px;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px}
.ban{width:100%;border-collapse:collapse;font-size:13px}
.ban th,.ban td{border:1px solid var(--vien);padding:5px 4px;text-align:center;vertical-align:top}
.ban th{background:var(--kem2);font-weight:600}
.ban td.ten{text-align:left}
.o-ca{min-height:44px;font-size:12px;text-align:left;cursor:pointer}
.o-ca.chon{background:#e3f2e5}
.o-ca .nguoi{display:block;padding:1px 0}
.o-ca .nguoi.du{color:var(--mo);font-style:italic}
.thongbao{position:fixed;left:12px;right:12px;bottom:80px;background:#333;color:#fff;padding:12px 14px;border-radius:10px;z-index:20;font-size:14px;display:none}
.thongbao.loi{background:var(--do)}.thongbao.ok{background:var(--xanh)}
.phu-lop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end}
.phu-lop.mo{display:flex}
#xemanh{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column}
#xemanh.mo{display:flex}
#xemanh img{max-width:100vw;max-height:88vh;object-fit:contain;background:#fff;border-radius:6px;touch-action:pinch-zoom}
#xemanh .thanh{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;color:#fff;font-size:14px}
#xemanh .thanh a{color:#fff;text-decoration:underline}
#xemanh .thanh button{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:18px;border-radius:50%;width:36px;height:36px}
.hop{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.hop h3{margin:0 0 10px;font-size:16px;color:var(--nau)}
.dang-nhap{max-width:360px;margin:10vh auto;padding:24px}
.dang-nhap h1{color:var(--nau);text-align:center;margin:0 0 4px}
.tt{text-align:center;color:var(--mo);font-size:13px;margin-bottom:16px}
.kq{padding:10px;border-radius:10px;background:var(--kem2);margin-top:10px;font-size:14px}
.kq.xanh{background:#e3f2e5}.kq.do{background:#fbe5e5}
.tai{text-align:center;color:var(--mo);padding:20px}
.chip{display:inline-block;border:1px solid var(--vien);border-radius:999px;padding:6px 12px;margin:3px 3px 3px 0;font-size:14px;background:#fff;cursor:pointer}
.chip.on{background:var(--nau);color:#fff;border-color:var(--nau)}
.badge{background:var(--do);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px}
details summary{cursor:pointer;color:var(--nau);font-weight:600;font-size:14px;padding:6px 0}
.bpt{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--vien);box-shadow:0 -6px 20px rgba(0,0,0,.15);z-index:30;padding:10px 10px calc(10px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;display:none}
.bpt.mo{display:block}
.bpt .hien{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 8px}
.bpt .hien b{font-size:26px;color:var(--nau)}
.bpt .hien span{font-size:13px;color:var(--mo)}
.bpt .goiy{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.bpt .goiy span{font-size:12px;color:var(--mo);flex:0 0 auto}
.bpt .goiy button{flex:1;border:1px solid var(--nau);background:#fff7ec;border-radius:8px;padding:10px 0;font-size:15px;font-weight:700;color:var(--nau)}
.bpt .menh{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.bpt .menh button{border:1px solid var(--vien);background:var(--kem);border-radius:8px;padding:9px 0;font-size:13px;font-weight:600;color:var(--nau)}
.bpt .phim{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bpt .phim button{border:1px solid var(--vien);background:#fff;border-radius:10px;padding:14px 0;font-size:20px;font-weight:600}
.bpt .phim button.xam{background:var(--kem2);font-size:15px}
.bpt .phim button.xong{background:var(--xanh);color:#fff;grid-row:span 2;font-size:17px}
.bpt .phim button.xoa{color:var(--do)}
.bpt .to{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:44vh;overflow:auto;margin-bottom:8px}
.bpt .to .d{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--vien);border-radius:8px;padding:4px 6px;font-size:14px}
.bpt .to .d button{border:0;background:var(--kem2);border-radius:6px;width:34px;height:34px;font-size:18px;color:var(--nau)}
.bpt .to .d input{width:44px;text-align:center;border:0;font-size:16px;font-weight:600;padding:4px}
.bpt .cd{display:flex;gap:6px;margin-bottom:8px}
.bpt .cd button{flex:1;border:1px solid var(--vien);background:#fff;border-radius:999px;padding:6px;font-size:13px;color:var(--mo)}
.bpt .cd button.on{background:var(--nau);color:#fff;border-color:var(--nau)}
input.tien{background:#fffdf7;cursor:pointer}
.vt{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;margin:2px 4px 2px 0;white-space:nowrap}
.vt-pha_che{background:#e8d9c5;color:#5b3a1e}.vt-thu_ngan{background:#dcedc8;color:#2e5d13}.vt-di_nuoc{background:#d6e8f7;color:#0d4a7a}.vt-truc_khu{background:#fce4c8;color:#8a4b00}.vt-quan_ly{background:#e6dcf2;color:#4a2a7a}.vt-du_bi{background:#eee;color:#666;font-style:italic}.vt-chua{background:#fff;border:1px dashed #bbb;color:#777}
.the-ca{border:1px solid var(--vien);border-radius:10px;padding:8px 10px;margin-top:8px;cursor:pointer;background:#fff}
.the-ca.thieu{border-color:#f0b37e;background:#fffaf4}
.the-ca .dau{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;color:var(--nau)}
.the-ca .nhom{font-size:12px;color:var(--mo);margin-top:4px}
.viec{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--vien);font-size:15px}
.viec:last-child{border-bottom:0}
.viec input{width:22px;height:22px;margin-top:1px;flex:0 0 auto}
.viec.xong span{color:var(--mo);text-decoration:line-through}
.bc{border:1px solid var(--vien);border-radius:10px;padding:10px;margin-top:8px}
.bc.tre{border-color:var(--do);background:#fff6f6}.bc.xong{border-color:#bfe3c3;background:#f4fbf5}
.anh-nho{display:inline-block;width:64px;height:64px;border-radius:8px;object-fit:cover;margin:3px 3px 0 0;border:1px solid var(--vien)}
body.kiosk{background:#1f140b}
.ki{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff;text-align:center}
.ki h1{font-size:clamp(20px,4vw,34px);margin:0}
.ki .gio{font-size:clamp(30px,7vw,60px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 10px}
.ki .khung{background:#fff;border-radius:20px;padding:14px;width:min(84vw,60vh,540px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#7a6a5a;font-size:15px}
.ki .khung svg{width:100%;height:100%;display:block}
.ki .thanh{width:min(84vw,60vh,540px);height:6px;background:#ffffff26;border-radius:3px;margin-top:12px;overflow:hidden}
.ki .thanh i{display:block;height:100%;background:#ffcc80;width:100%;transition:width 1s linear}
.ki .loiKi{color:#ffab91}
.ki .tt{margin-top:12px;font-size:clamp(15px,2.4vw,20px);color:#f3e6d6}
.ki .thoat{position:fixed;right:8px;bottom:8px;background:none;border:0;color:#ffffff40;font-size:22px;padding:10px;cursor:pointer}
.qr-ok{background:#e3f2e5;color:var(--xanh);border-radius:10px;padding:12px;font-weight:600}
.dangtai{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
.dangtai.mo{opacity:1}
.dangtai i{position:absolute;top:0;bottom:0;width:40%;background:var(--vang);animation:chayTai 1s ease-in-out infinite}
@keyframes chayTai{0%{left:-40%}100%{left:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dangtai" class="dangtai"><i></i></div>
<div id="thongbao" class="thongbao"></div>
<div id="bpt" class="bpt"></div>
<div id="phulop" class="phu-lop" onclick="if(event.target===this)dongHop()"><div class="hop" id="hop"></div></div>

<script>
// ============================ TRẠNG THÁI ============================
var S = { token: null, nv: null, kd: null, man: 'nha', tab: {}, cache: {} };
try { S.token = localStorage.getItem('qc_token'); } catch (e) {}
var TEN_TT = { cho_nhan: 'Chờ nhận', cho_chi: 'Chờ chi', dieu_dong: 'Đang đi mua', dang_lam: 'Đang làm', xong: 'Xong', cho_duyet: 'Chờ duyệt', da_duyet: 'Đã duyệt', da_chi: 'Đã chi', da_xac_nhan: 'Đã xác nhận', tu_choi: 'Từ chối', dieu_chinh: 'Điều chỉnh', cho_thanh_toan: 'Chờ trả', da_tra: 'Đã trả', tru_tra_truoc: 'Trừ trả trước', hoat_dong: 'Hoạt động', ngung: 'Ngưng', moi: 'Mới', xep: 'Đã xếp', cong_bo: 'Công bố', nhan: 'Đã nhận', huy: 'Huỷ', goi_du_bi: 'Đang gọi', dong_y: 'Đồng ý' };
var GD = { dau_ca: 'Đầu ca', trong_ca: 'Trong ca', cuoi_ca: 'Cuối ca', toilet: 'Kiểm toilet' };
var LOAI_YC = { doi_ca: 'Đổi ca', xin_nghi: 'Xin nghỉ', tam_ung: 'Tạm ứng', sua_cham_cong: 'Sửa chấm công', chi: 'Đề nghị chi' };

// ============================ GỌI SERVER ============================
var _dangGoi = 0;
function khoaNut_(khoa) {
  document.querySelectorAll('button.nut').forEach(function (b) { if (khoa) { if (!b.disabled) { b.disabled = true; b.dataset.khoa = '1'; } } else if (b.dataset.khoa) { b.disabled = false; delete b.dataset.khoa; } });
}
var _dangGui = {};
/** Lệnh chỉ đọc (xem danh sách, số liệu): không khoá nút, bấm lặp thì dùng chung lượt đang tải. */
var LENH_DOC = /(^khoiDong$|^ds[A-Z]|_ds$|_lay$|_thang$|_ngay$|_chuanBi$|_ton$|_soKho$|_thongKe$|_cuaToi$|_lichSu$|KiemTra$|^yeuCauChi_choChi$|^qr_dsMay$)/;
var _dangDoc = {};
/* ---- Bộ nhớ tạm số liệu (2.12): mở lại tab đã xem thì hiện ngay, lấy số mới ở phía sau rồi tự cập nhật ---- */
var BO_NHO = {}, TUOI_MOI = 20000; // trong 20 giây coi như mới, không hỏi lại máy chủ
var KHONG_NHO = /(^khoiDong$|_chuanBi$|KiemTra$|^qr_dsMay$|^qrTk_lay$)/; // luôn lấy mới
function banSao_(v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); }
function xoaBoNho() { BO_NHO = {}; try { localStorage.removeItem(KHOA_BN); } catch (e) {} }
/* ---- 2.23 · Bộ nhớ tạm bền: cất xuống điện thoại, mở lại app (kể cả sau khi điện thoại đóng trang) vẫn hiện ngay số lần trước rồi lấy số mới ở phía sau.
   Sau khi ghi (lưu phiếu, duyệt…) không xoá mà đánh dấu CŨ: màn hình kế vẫn hiện ngay, số mới về sau 1–2 giây thì tự vẽ lại. ---- */
var KHOA_BN = 'qc_bn', BN_MOI_MUC = 150000, BN_TONG = 2500000;
function cuBoNho_() { Object.keys(BO_NHO).forEach(function (k) { BO_NHO[k].luc = 0; }); luuBoNho_(); }
function luuBoNho_() {
  clearTimeout(luuBoNho_._t);
  luuBoNho_._t = setTimeout(function () {
    if (!S.token) return;
    try {
      var ks = Object.keys(BO_NHO).filter(function (k) { var b = BO_NHO[k]; return b && b.s && b.s.length <= BN_MOI_MUC && b.s.indexOf('data:image') < 0; })
        .sort(function (a, b) { return BO_NHO[b].luc - BO_NHO[a].luc; });
      var o = {}, tong = 0;
      ks.forEach(function (k) { var b = BO_NHO[k]; if (tong + b.s.length > BN_TONG) return; tong += b.s.length; o[k] = { s: b.s, luc: b.luc }; });
      localStorage.setItem(KHOA_BN, JSON.stringify({ t: S.token, pb: PHIEN_BAN_APP, ngay: ngayMay_(), d: o }));
    } catch (e) { try { localStorage.removeItem(KHOA_BN); } catch (x) {} }
  }, 400);
}
function napBoNho_() {
  try {
    var o = JSON.parse(localStorage.getItem(KHOA_BN) || 'null');
    if (!o || o.t !== S.token || o.pb !== PHIEN_BAN_APP || o.ngay !== ngayMay_()) return;
    Object.keys(o.d).forEach(function (k) { if (!BO_NHO[k]) BO_NHO[k] = { v: JSON.parse(o.d[k].s), luc: 0, s: o.d[k].s }; }); // luc = 0 → hiện ngay nhưng luôn lấy số mới ở phía sau
  } catch (e) {}
}
function goi(hanhDong, du) {
  var khoaGui = hanhDong + JSON.stringify(du || {}).slice(0, 300);
  var laDoc = LENH_DOC.test(hanhDong);
  if (laDoc) {
    var nho = !KHONG_NHO.test(hanhDong), bn = nho && BO_NHO[khoaGui];
    if (bn) { if (Date.now() - bn.luc > TUOI_MOI) lamTuoi_(hanhDong, du, khoaGui); return Promise.resolve(banSao_(bn.v)); }
    if (_dangDoc[khoaGui]) return _dangDoc[khoaGui].then(banSao_);
    var p = goiMay_(hanhDong, du).then(function (v) { delete _dangDoc[khoaGui]; if (nho) { BO_NHO[khoaGui] = { v: v, luc: Date.now(), s: JSON.stringify(v) }; luuBoNho_(); } return v; }, function (e) { delete _dangDoc[khoaGui]; throw e; });
    return (_dangDoc[khoaGui] = p).then(banSao_);
  }
  if (S.choKD && hanhDong !== 'khoiDong') { var cho = S.choKD; return cho.then(function () { return goi(hanhDong, du); }, function () { return goi(hanhDong, du); }); } // đợi số mới (mở app tức thì)
  if (_dangGui[khoaGui]) return Promise.reject(new Error('Đang gửi, vui lòng chờ…'));
  _dangGui[khoaGui] = true;
  _dangGoi++; khoaNut_(true);

function layIP() {

  var nguon = ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json', 'https://ipinfo.io/json'];
  var thu = function (i) {
    if (i >= nguon.length) return Promise.resolve('');

  };
  return thu(0);
}

function layIPKiosk_() {

  goiKiosk_().then(function (d) {
    var q = qrcode(0, 'M'); q.addData(d.noiDung); q.make();
    var k = document.getElementById('ki_qr'); if (k) { k.innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); k.dataset.co = '1'; }
    var t = document.getElementById('ki_ten'); if (t) t.textContent = '☕ ' + d.tenQuan;
    KI.het = Date.now() + d.conLai * 1000; KI.loi = 0;
    ttKiosk_(d.cheDo ? 'Mở app → Chấm vào / Chấm ra → quét mã này' : 'Chấm công QR đang TẮT. Quản lý bật trong Cài đặt.', !d.cheDo);
    KI.t = setTimeout(kioskLamMoi_, Math.max(3000, d.conLai * 1000 + 400));
  }).catch(function (e) {
    if (/MAY_THU_HOI/.test(e.message)) {
      var tuLink = KIOSK && KIOSK.tuLink, laTK = KIOSK && KIOSK.taiKhoan;
      try { localStorage.removeItem('qc_kiosk'); } catch (x) {}
      KIOSK = null; clearInterval(KI.dem);
      document.getElementById('ki_qr').innerHTML = 'Màn hình này đã bị thu hồi';
      ttKiosk_(tuLink ? 'Link này không còn dùng được. Quản lý tạo link mới trong Cài đặt → Chấm công bằng QR.' : laTK ? 'Tài khoản màn hình QR đã đổi PIN hoặc bị tắt. Đăng nhập lại.' : 'Quản lý đăng nhập lại và đăng ký máy này nếu muốn dùng tiếp.', true);
      if (!tuLink) setTimeout(function () { document.body.className = ''; if (S.token) khoiDong(); else manDangNhap(); }, 8000);
      return;
    }
    var mw = /CAN_WIFI\|(.*)/.exec(e.message);
    if (mw) {
      KI.ip = ''; // tra lại IP ở lần sau (có thể vừa chuyển sang wifi quán)
      var q = document.getElementById('ki_qr'); if (q) { q.innerHTML = 'Chưa có mã'; delete q.dataset.co; }
      ttKiosk_('Màn hình QR phải kết nối wifi quán (mạng hiện tại: ' + mw[1] + '). Tắt 4G, bật wifi quán. Đang thử lại…', true);
      KI.t = setTimeout(kioskLamMoi_, 15000);
      return;
    }
    KI.loi++;
    ttKiosk_('Mất kết nối (' + e.message + '). Đang thử lại…', true);
    KI.t = setTimeout(kioskLamMoi_, KI.loi < 5 ? 4000 : 15000);
  });
}
function thoatKiosk() {
  if (!confirm(KIOSK && KIOSK.taiKhoan ? 'Đăng xuất màn hình QR?\nĐăng nhập lại bằng mã + PIN tài khoản màn hình QR để hiện mã.' : KIOSK && KIOSK.tuLink ? 'Thoát màn hình QR?\nMở lại link màn hình QR là hiện mã lại.' : 'Thoát chế độ màn hình QR?\nMáy này sẽ phải đăng ký lại mới hiện mã được. Quản lý nên Thu hồi máy này trong Cài đặt.')) return;
  try { localStorage.removeItem('qc_kiosk'); } catch (e) {}
  KIOSK = null; clearTimeout(KI.t); clearInterval(KI.dem); KI.het = 0;
  document.body.className = ''; manDangNhap();
}
// ---- Quản lý: đăng ký / thu hồi màn hình, bật chế độ ----
var TEN_CD_QR = { 0: 'Tắt', 1: 'Chỉ cần quét QR (bỏ kiểm tra wifi)', 2: 'Quét QR và phải dùng wifi quán' };
function khoiQR_() {
  var cd = S.kd.caiDat.qr || 0;
  return '<div class="the"><h2>📺 Chấm công bằng QR ở quầy</h2>' +
    '<div class="mo">Một máy ở quầy (tablet, điện thoại cũ) luôn bật, hiện mã QR tự đổi mỗi 30 giây. Nhân viên phải quét mã này mới chấm công được, ảnh chụp mã chỉ dùng được khoảng 1 phút.</div>' +
    '<div class="kq" style="margin-top:8px">Đang: <b>' + h(TEN_CD_QR[cd]) + '</b></div>' +
    '<label>Chế độ</label><div class="hang"><select id="qr_cd">' + [1, 2, 0].map(function (v) { return '<option value="' + v + '"' + (v === cd ? ' selected' : '') + '>' + h(TEN_CD_QR[v]) + '</option>'; }).join('') + '</select><button class="nut nho" style="flex:0 0 auto" onclick="luuCheDoQR()">Lưu</button></div>' +
    '<div class="bc" style="margin-top:10px"><b>👤 Tài khoản màn hình QR</b>' +
    '<div class="mo" style="margin-top:4px">Đặt một mã + PIN riêng. Trên máy ở quầy, đăng nhập app bằng mã + PIN này → máy chỉ hiện mã QR chấm công, không xem được gì khác. Tài khoản này không phải nhân viên, không tính lương.</div>' +
    '<div id="qrtk_tt" class="mo" style="margin-top:6px">Đang tải…</div>' +
    '<div class="hang" style="margin-top:6px"><input id="qrtk_ma" type="text" autocapitalize="characters" placeholder="Mã đăng nhập, VD: QUAY"><input id="qrtk_pin" type="text" inputmode="numeric" placeholder="PIN 4–8 số"></div>' +
    '<div class="hang" style="margin-top:6px"><button class="nut nho" onclick="luuTkQR()">Lưu tài khoản</button><button class="nut nho phu" onclick="tatTkQR()">Tắt tài khoản</button></div></div>' +
    '<label>Màn hình đã đăng ký</label><div id="qr_ds_may" class="mo">Đang tải…</div>' +
    '<div id="qr_link_hop"></div>' +
    '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px"><button class="nut" onclick="taoLinkMayQR()">🔗 Tạo link màn hình QR (không cần đăng nhập)</button><button class="nut phu" onclick="dangKyMayQR()">📺 Dùng máy này làm màn hình QR</button></div>' +
    '<div class="mo" style="margin-top:8px"><b>Cách 1 – Link:</b> bấm Tạo link, rồi mở link đó trên máy ở quầy (gửi qua Zalo/Telegram, hoặc dùng camera máy quầy quét mã QR hiện ra bên dưới). Máy quầy chỉ hiện mã QR chấm công, không đăng nhập, không xem được gì khác. Lưu link vào màn hình chính / dấu trang để mở lại khi máy khởi động lại.<br><b>Cách 2:</b> đăng nhập quản lý ngay trên máy quầy → bấm “Dùng máy này”.<br>⚠ Ai có link là hiện được mã: chỉ gửi cho máy quầy. Nếu lộ link, bấm Thu hồi rồi tạo link mới. Nên dùng chế độ “Quét QR và phải dùng wifi quán” – khi đó màn hình cũng phải ở wifi quán mới ra mã.<br>Nhân viên không quét được (máy quầy hỏng) vẫn chấm công được bằng cách ghi lý do, ca đó chờ quản lý duyệt.</div></div>';
}
function taiTkQR_() {
  var e = document.getElementById('qrtk_tt'); if (!e) return;
  goi('qrTk_lay').then(function (d) {
    e.innerHTML = d.ma && d.coPin ? 'Đang dùng mã <b>' + h(d.ma) + '</b>. Đổi PIN: nhập mã + PIN mới rồi Lưu (máy quầy sẽ phải đăng nhập lại).' : 'Chưa bật. Nhập mã + PIN rồi bấm Lưu.';
    var o = document.getElementById('qrtk_ma'); if (o && d.ma && !o.value) o.value = d.ma;
  }).catch(function (x) { e.textContent = x.message; });
}
function luuTkQR() {
  goi('qrTk_luu', { ma: gt('qrtk_ma'), pin: gt('qrtk_pin') }).then(function (d) {
    bao('Đã lưu. Trên máy quầy đăng nhập mã ' + d.ma + ' + PIN vừa đặt.', 'ok');
    var p = document.getElementById('qrtk_pin'); if (p) p.value = '';
    taiTkQR_(); taiDsMayQR_();
  }).catch(loi);
}
function tatTkQR() {
  if (!confirm('Tắt tài khoản màn hình QR? Máy quầy đang đăng nhập bằng tài khoản này sẽ bị đăng xuất.')) return;
  goi('qrTk_luu', { tat: true }).then(function () { bao('Đã tắt tài khoản màn hình QR', 'ok'); taiTkQR_(); taiDsMayQR_(); }).catch(loi);
}
function taiDsMayQR_() {
  taiTkQR_();
  var e = document.getElementById('qr_ds_may'); if (!e) return;
  goi('qr_dsMay').then(function (ds) {
    LINK_QR = {}; ds.forEach(function (m) { LINK_QR[m.id] = { link: m.link, ten: m.ten }; });
    e.innerHTML = ds.length ? ds.map(function (m) {
      return '<div class="dong"><div class="trai"><b>' + h(m.ten) + '</b><div class="mo">' + (m.lanCuoi ? 'Hoạt động lần cuối ' + h(ngayVN(m.lanCuoi)) : 'Chưa thấy hoạt động') + ' · đăng ký ' + h(ngayVN(m.taoLuc)) + '</div></div><div class="phai" style="display:flex;gap:6px">' + (m.link ? '<button class="nut nho phu" onclick="xemLinkQR(\'' + h(m.id) + '\')">🔗 Link</button>' : '') + '<button class="nut nho do" onclick="thuHoiMayQR(\'' + h(m.id) + '\',\'' + h(m.ten).replace(/'/g, '') + '\')">Thu hồi</button></div></div>';
    }).join('') : 'Chưa có màn hình nào.';
  }).catch(function (x) { e.textContent = x.message; });
}
function luuCheDoQR() { goi('qr_cheDo', { cheDo: Number(gt('qr_cd')) }).then(function (cd) { bao('Đã lưu: ' + TEN_CD_QR[cd], 'ok'); lamMoi(); }).catch(loi); }
function thuHoiMayQR(id, ten) { if (!confirm('Thu hồi màn hình "' + ten + '"? Máy đó sẽ ngừng hiện mã.')) return; goi('qr_thuHoi', { id: id }).then(function () { bao('Đã thu hồi', 'ok'); taiDsMayQR_(); }).catch(loi); }
var LINK_QR = {};
/** Tạo màn hình mới dạng link: máy này KHÔNG đăng xuất, chỉ hiện link để mở trên máy quầy. */
function taoLinkMayQR() {
  var ten = prompt('Đặt tên cho màn hình (VD: Tablet quầy thu ngân):', 'Màn hình quầy'); if (ten === null) return;
  goi('qr_dangKyMay', { ten: ten }).then(function (d) {
    if (!d.link) return bao('Chưa có link web app. Điền link_webapp trong Cài đặt rồi tạo lại.', 'loi');
    LINK_QR[d.id] = { link: d.link, ten: d.ten };
    bao('Đã tạo màn hình "' + d.ten + '"', 'ok');
    taiDsMayQR_(); xemLinkQR(d.id);
  }).catch(loi);
}
function xemLinkQR(id) {
  var m = LINK_QR[id], hop = document.getElementById('qr_link_hop'); if (!m || !hop) return;
  hop.innerHTML = '<div class="bc" style="margin-top:10px"><b>🔗 Link màn hình: ' + h(m.ten) + '</b>' +
    '<div class="hang" style="margin-top:6px"><input id="qr_link_o" type="text" readonly value="' + h(m.link) + '" onclick="this.select()"><button class="nut nho" style="flex:0 0 auto" onclick="chepLinkQR()">Chép</button></div>' +
    '<div class="mo" style="margin-top:6px">Dùng camera máy ở quầy quét mã này để mở link (mã này KHÔNG phải mã chấm công):</div>' +
    '<div id="qr_link_anh" style="width:200px;max-width:100%;margin:6px auto 0;background:#fff;padding:6px;border-radius:8px">Đang vẽ…</div>' +
    '<div style="text-align:center;margin-top:6px"><button class="nut nho phu" onclick="document.getElementById(\'qr_link_hop\').innerHTML=\'\'">Ẩn</button></div></div>';
  taiThuVienQR_().then(function () {
    var q = qrcode(0, 'L'); q.addData(m.link); q.make();
    var e = document.getElementById('qr_link_anh'); if (e) e.innerHTML = q.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
  }).catch(function () { var e = document.getElementById('qr_link_anh'); if (e) e.textContent = 'Không vẽ được mã, hãy chép link.'; });
}
function chepLinkQR() {
  var o = document.getElementById('qr_link_o'); if (!o) return;
  var xong = function () { bao('Đã chép link', 'ok'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(o.value).then(xong).catch(function () { o.select(); try { document.execCommand('copy'); xong(); } catch (e) { bao('Hãy giữ vào ô link để chép', 'loi'); } });
  else { o.select(); try { document.execCommand('copy'); xong(); } catch (e) { bao('Hãy giữ vào ô link để chép', 'loi'); } }
}
function dangKyMayQR() {
  var ten = prompt('Đặt tên cho màn hình này (VD: Tablet quầy thu ngân):', 'Màn hình quầy'); if (ten === null) return;
  if (!confirm('Máy này sẽ chuyển thành màn hình QR và ĐĂNG XUẤT tài khoản của bạn. Tiếp tục?')) return;
  try { localStorage.setItem('qc_thu', '1'); localStorage.removeItem('qc_thu'); } catch (e) { return bao('Trình duyệt này chặn lưu dữ liệu, không dùng làm màn hình được. Hãy mở bằng Chrome hoặc Safari thường.', 'loi'); }
  goi('qr_dangKyMay', { ten: ten }).then(function (d) {
    KIOSK = { id: d.id, khoa: d.khoa, ten: d.ten };
    try { localStorage.setItem('qc_kiosk', JSON.stringify(KIOSK)); localStorage.removeItem('qc_token'); } catch (e) {}
    S.token = null; S.nv = null;
    manKiosk();
  }).catch(loi);
}
// ---- Nhân viên: quét QR khi chấm công ----
function veQRConHan_() { return S.veQR && S.veQR.het > Date.now() ? S.veQR : null; }
function oQR_() {
  if (!S.kd.caiDat.qr) return '';
  return '<label>Mã QR ở quầy <b>(bắt buộc)</b></label><div id="qr_o">' + noiDungOQR_() + '</div>' +
    '<details style="margin-top:6px"><summary class="mo">Màn hình quầy hỏng, không quét được?</summary><input id="qr_lydo" type="text" placeholder="Ghi lý do (ca sẽ chờ quản lý duyệt)"></details>';
}
function noiDungOQR_(thongBao) {
  var v = veQRConHan_();
  if (v) return '<div class="qr-ok">✅ Đã quét mã tại ' + h(v.tenMay) + '</div>';
  return (thongBao ? '<div class="kq" style="margin-bottom:6px;color:var(--do)">' + h(thongBao) + '</div>' : '') +
    '<div class="anh-o" id="oanh_qrq" style="min-height:90px"><span>📷 Bấm để chụp mã QR trên màn hình quầy</span><input type="file" accept="image/*" capture="environment" onchange="chonAnh(this,\'qrq\')"></div>';
}
function veLaiOQR_(thongBao) { var o = document.getElementById('qr_o'); if (o) o.innerHTML = noiDungOQR_(thongBao); }
SAU_ANH.qrq = function (canvas) {
  delete ANH.qrq;
  var d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  taiJsQR_().then(function () {
  var qr = typeof jsQR === 'function' ? jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' }) : null;
  setTimeout(function () { // chờ chonAnh vẽ xong ảnh xem trước rồi mới thay khung
    if (!qr || !qr.data) return veLaiOQR_('Không đọc được mã. Chụp gần hơn, thẳng, mã nằm trọn trong khung rồi thử lại.');
    veLaiOQR_(); var o = document.getElementById('qr_o'); if (o) o.innerHTML = '<div class="mo">Đang kiểm tra mã…</div>';
    quetQR_(qr.data).catch(function (e) { veLaiOQR_(e.message); });
  }, 0);
  });
};
function quetQR_(noiDung) {
  return goi('qr_quet', { qr: noiDung }).then(function (d) { S.veQR = { ve: d.ve, tenMay: d.tenMay, het: Date.now() + 9 * 60000 }; veLaiOQR_(); return d; });
}
/** Dữ liệu QR gửi kèm chấm công; null nếu thiếu (đã báo lỗi). */
function duQR_() {
  if (!S.kd.caiDat.qr) return {};
  var v = veQRConHan_(), ly = gt('qr_lydo') || S._lyDoQR || '';
  if (!v && !ly) { bao('Hãy quét mã QR trên màn hình ở quầy', 'loi'); return null; }
  S._lyDoQR = ly;
  return v ? { veQR: v.ve } : { lyDoKhongQR: ly };
}
function xongQR_() { S.veQR = null; S._lyDoQR = ''; }
/** Mở app bằng camera điện thoại quét mã ở quầy (link có ?cc=…): tự kiểm mã rồi mở hộp chấm vào / chấm ra. */
function thamSoLink_(ten) { try { return String(new URLSearchParams(location.search).get(ten) || '').replace(/[^A-Za-z0-9.\-_]/g, '').slice(0, 120); } catch (e) { return ''; } }
function xuLyLinkQR_() {
  if (xuLyLinkQR_.xong) return;
  if (API_URL) { xuLyLinkQR_.xong = true; var cc0 = thamSoLink_('cc'); if (cc0 && S.kd && S.kd.caiDat.qr) quetQR_(cc0).then(function () { S.man = 'nha'; ve(); if (S.kd.trangThai.dangLam) chamRa(); else chamVao(); }).catch(loi); return; } // 2.24: trang ngoài đọc thẳng ?cc=
  if (typeof google === 'undefined' || !google.script || !google.script.url) return;
  xuLyLinkQR_.xong = true;
  google.script.url.getLocation(function (loc) {
    var cc = loc && loc.parameter && loc.parameter.cc;
    if (!cc || !S.kd || !S.kd.caiDat.qr) return;
    quetQR_(cc).then(function () { S.man = 'nha'; ve(); if (S.kd.trangThai.dangLam) chamRa(); else chamVao(); }).catch(loi);
  });
}

// ============================ KHỞI ĐỘNG ============================
if (KIOSK) manKiosk(); else if (S.token) khoiDong(); else manDangNhap();
</script>
